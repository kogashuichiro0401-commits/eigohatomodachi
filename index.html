<style>
/* layout: one reading column; home = "初めての方はこちら" banner, three numbered menu rows, then board/feedback tiles; each menu opens as its own view */
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --ink:#17212A; --muted:#5B6670; --line:#D8DED9;
  --accent:#1E5A52; --accent-soft:#E2EDEA; --warn:#8A4A12; --warn-soft:#F6EBDD;
  --f-head:"Gentium Book Plus","Charis SIL","Noto Serif","Times New Roman",serif;
  --f-ja:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111618; --surface:#181F22; --ink:#E5EBE8; --muted:#97A29F; --line:#2B3539;
  --accent:#73B9AC; --accent-soft:#1D3330; --warn:#E3A86B; --warn-soft:#33281C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111618; --surface:#181F22; --ink:#E5EBE8; --muted:#97A29F; --line:#2B3539;
  --accent:#73B9AC; --accent-soft:#1D3330; --warn:#E3A86B; --warn-soft:#33281C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ja);font-size:15px;line-height:1.75}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:28px 60px}
header.top{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-size:1.35rem;font-weight:700;letter-spacing:.04em;text-decoration:none;color:var(--ink)}
.brand span{font-weight:500;font-size:.85rem;color:var(--muted);margin-left:8px;letter-spacing:.08em}
.fb-link{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px}
.fb-link:hover{border-color:var(--accent)}
@media (max-width:520px){.fb-l{display:none}}
.demo-tag{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 8px;align-self:center}
h1{font-family:var(--f-head);font-size:2rem;line-height:1.25;margin:0 0 8px;text-wrap:balance}
h2{font-size:1.1rem;margin:0 0 6px}
h3{font-size:.95rem;margin:0 0 4px}
p{margin:0 0 12px}
.lead{color:var(--muted);max-width:62ch}
.dim{color:var(--muted)}
a{color:var(--accent)}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:6px;padding:8px 18px;font-weight:700;font-size:.95rem;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:3px 12px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{display:inline-block;margin-bottom:14px;font-size:.88rem;color:var(--muted)}

/* home */
.menu{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}
.menu a{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.menu a:hover{background:var(--accent-soft)}
.menu .no{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem}
.menu .t{font-weight:700;font-size:1.05rem}
.menu .d{display:block;color:var(--muted);font-size:.86rem}
.menu .go{color:var(--accent);font-size:1.2rem}
.plaza{margin-top:34px}
.plaza .lab{font-size:.78rem;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:8px}
.plaza-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tile{display:block;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile p{margin:0;color:var(--muted);font-size:.86rem}
.first{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--accent);color:var(--surface);border-radius:10px;padding:16px 20px;text-decoration:none;margin-bottom:6px}
.first:hover{filter:brightness(1.08)}
.first-t{display:block;font-weight:700;font-size:1.12rem;letter-spacing:.02em}
.first-d{display:block;font-size:.86rem;opacity:.88;margin-top:2px}
.first .go{font-size:1.5rem;line-height:1}

/* intro */
.hero{padding:6px 0 30px;border-bottom:1px solid var(--line)}
.kicker{font-size:.8rem;letter-spacing:.12em;color:var(--accent);font-weight:700;margin:0 0 8px}
.hero h1{font-family:var(--f-ja);font-size:clamp(1.6rem,5.2vw,2.3rem);line-height:1.35;font-weight:700;margin:0 0 14px}
.hero .lead{font-size:1rem;color:var(--ink)}
.hero .lead b{background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.cta{margin:18px 0 0}
.isec{padding:34px 0 30px;border-bottom:1px solid var(--line)}
.isec:last-child{border-bottom:0}
.ilab{font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 4px}
.ih{font-size:1.35rem;line-height:1.4;margin:0 0 12px}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:grid;gap:10px;margin-top:16px}
.chat .cl{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.08em;margin:0}
.chat .b{max-width:min(86%,520px);padding:9px 14px;border-radius:14px;font-size:.92rem;line-height:1.65}
.chat .me{justify-self:end;background:var(--accent);color:var(--surface);border-bottom-right-radius:4px}
.chat .ai{justify-self:start;background:var(--accent-soft);color:var(--ink);border-bottom-left-radius:4px}
.chips{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.84rem}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:22px}
.pts h3{color:var(--accent);margin-bottom:2px}
.pts p{margin:0;font-size:.88rem;color:var(--muted)}
.shot{margin:0 0 22px}
.mini{margin:4px 0 10px;padding-left:1.4em;color:var(--ink)}
.mini li{margin:0 0 4px}
.how{margin:10px 0 8px}
.how img{display:block;width:100%;max-width:640px;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.how a{display:block;max-width:640px}
.how figcaption{font-size:.84rem;color:var(--muted);margin-top:6px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 6px 22px rgba(23,33,42,.08)}
.shot.wide img{width:min(1120px,calc(100vw - 32px));max-width:none;position:relative;left:50%;transform:translateX(-50%)}
.shot figcaption{font-size:.9rem;color:var(--muted);margin-top:10px}
.shot figcaption b{display:block;color:var(--ink);font-size:1rem;margin-bottom:2px}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin:0 0 14px}
.notice{border-radius:6px;padding:10px 14px;margin:0 0 14px;font-size:.9rem;background:var(--accent-soft)}
.notice.warn{background:var(--warn-soft)}
.notice b{color:var(--warn)}
.steps{list-style:none;margin:0 0 18px;padding:0;counter-reset:s}
.steps>li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.steps>li:last-child{border-bottom:1px solid var(--line)}
.steps>li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:500}
.steps h3{margin:0 0 2px}
.steps p{margin:0 0 6px;color:var(--muted)}
.prompt{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px 70px 10px 12px;font-size:.88rem;margin:6px 0}
.prompt button{position:absolute;right:8px;top:8px}
.dl{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.dl .meta{min-width:0;flex:1 1 220px}
.dl .v{font-family:var(--f-head);font-size:1.3rem;font-weight:700}
.dl .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
table.vers{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:10px}
table.vers th,table.vers td{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
table.vers th{font-size:.75rem;color:var(--muted);font-weight:700}
.vwrap{overflow-x:auto}

/* forms */
label{display:block;font-weight:700;font-size:.88rem;margin:10px 0 4px}
input[type=text],input[type=url],textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.err{color:var(--warn);font-size:.86rem;min-height:1.3em;margin:6px 0 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* lists */
.sub{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;margin:0 0 12px;display:grid;gap:6px}
.sub .head{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap}
.sub .nick{font-weight:700}
.sub .when{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.sub .pt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.sub .act{margin-top:4px}

/* board on home (left 7: thread / right 3: new + list) */
.bd{position:relative;left:50%;transform:translateX(-50%);width:min(1240px,calc(100vw - 32px));margin-top:30px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:16px;align-items:start}
.bd-main,.bd-side{background:var(--surface);border:1px solid var(--line);border-radius:12px;height:clamp(520px,76vh,860px);display:flex;flex-direction:column;min-width:0}
.bd-main{overflow-y:auto;padding:16px 20px 22px;scroll-margin-top:12px}
.bd-side{padding:14px 14px 10px;gap:10px}
.bd-lab{font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0}
.bd-new{width:100%}
.bd-list{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px}
.bd-list .threads{border-top:0}
.bd-list .threads li{display:block;padding:0;border-bottom:1px solid var(--line)}
.bd-list .threads button{display:block;width:100%;box-sizing:border-box;padding:9px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
.bd-list .threads button:hover{background:var(--accent-soft)}
.bd-list .threads button[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.bd-list .tl{display:block;font-weight:700;overflow-wrap:anywhere;line-height:1.45}
.bd-list .tl .c{color:var(--accent);font-weight:700;margin-left:4px}
.bd-list .tm{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-top:2px}
.bd-side .rules{margin:0;font-size:.76rem;line-height:1.6}
.threads button{all:unset}
.threads button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:760px){
  .bd{grid-template-columns:1fr;left:auto;transform:none;width:auto}
  .bd-side{order:-1;height:auto;max-height:none}
  .bd-list{max-height:46vh}
  .bd-main{height:auto;max-height:none;overflow:visible}
}

/* board (2ch style) */
.threads{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.threads li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.threads a{font-weight:700;overflow-wrap:anywhere}
.threads .m{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);white-space:nowrap}
.tt{font-size:1.2rem;font-weight:700;margin:0 0 12px;overflow-wrap:anywhere}
.res{border-top:1px solid var(--line);padding:10px 4px;scroll-margin-top:12px}
.res .rh{font-size:.82rem;color:var(--muted);font-family:var(--f-mono)}
.res .rh .n{color:var(--accent);font-weight:500}
.res .rh .nm{color:var(--accent);font-family:var(--f-ja);font-weight:700}
.res .rb{margin:6px 0 0 1.4em;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.res .rb a{color:var(--accent)}
.res.hit{background:var(--accent-soft)}
.rules{font-size:.84rem;color:var(--muted)}
</style>

var SDEMO = !CONFIG.gasUrl;
function uid(){
  var k = "eigo-uid", v = null;
  try{ v = localStorage.getItem(k); }catch(e){}
  if(!v || !/^[A-Za-z0-9]{16,64}$/.test(v)){
    var a = new Uint8Array(16); crypto.getRandomValues(a);

async function sheetGet(q){
  var r = await fetch(CONFIG.gasUrl + "?" + q + "&t=" + Date.now(), {cache:"no-store"});

}
function busiest(){
  var best = null;
  BD.list.forEach(function(t){ if(!best || (t.count||0) > (best.count||0) || ((t.count||0) === (best.count||0) && t.updated > best.updated)) best = t; });
  return best && best.id;
}

    return t ? {thread:t, posts:D_POSTS[n] || []} : null;
  }
  try{ return await sheetGet("a=thread&id=" + n); }
  catch(e){ return e.code === "not_found" ? null : "err"; }
}
function fillThread(d, n, jump){
  var box = $("#thread"); if(!box) return;
  if(d === "err"){ box.innerHTML = LOAD_ERR; return; }
  if(!d){ box.innerHTML = '<div class="card dim">このスレッドは見つかりません。</div>'; return; }
  var html = '<h2 class="tt">'+esc(d.thread.title)+'</h2>';
  d.posts.forEach(function(r){
    html += '<div class="res" id="res-'+r.no+'">' + (r.deleted
      ? '<div class="rh"><span class="n">'+r.no+'</span> 名前: <span class="nm">あぼーん</span></div><div class="rb dim">このレスは削除されました</div>'
      : '<div class="rh"><span class="n">'+r.no+'</span> 名前: <span class="nm">'+esc(r.name || "名無しさん")+'</span> : '+esc(fmtDate(r.at, true))+' ID:'+esc(r.uid || "???")+'</div><div class="rb">'+resBody(r.body)+'</div>') +
      '</div>';
  });
  var full = (d.thread.count || d.posts.length) >= 1000;
  html += full ? '<div class="card dim" style="margin-top:16px">このスレッドは書き込みの上限(1000)に達しました。新しいスレッドを立ててください。</div>'
    : '<form id="rpForm" class="card" style="margin-top:18px" novalidate>' +
      '<label for="rName">名前(空欄なら名無しさん)</label><input id="rName" type="text" maxlength="30" autocomplete="off">' +
      '<label for="rBody">書き込む内容</label><textarea id="rBody" maxlength="1500" placeholder="&gt;&gt;1 のように書くと、そのレスへの返信になります"></textarea>' +
      hpField("rHp") +
      '<p class="err" id="rErr" role="alert"></p><button class="btn" type="submit" id="rBtn">書き込む</button></form>';
  box.innerHTML = html;
  var f = $("#rpForm");
  if(f) f.addEventListener("submit", async function(e){
    e.preventDefault();
    var name = $("#rName").value.trim(), b = $("#rBody").value.trim(), err = $("#rErr"), btn = $("#rBtn");
    if(!b){ err.textContent = "書き込む内容を入れてください。"; return; }
    err.textContent = "";
    if(SDEMO){ err.textContent = "見本表示のため、送信できません。設定後に使えます。"; return; }
    btn.disabled = true; btn.textContent = "送信中…";
    try{
      var r = await sheetPost({action:"reply", id:n, name:name, body:b, hp:$("#rHp").value});
      fillThread(await loadThread(n), n, r.no);
      loadThreads().then(function(l){ if(l !== "err"){ BD.list = l; fillThreads(l); } });
    }catch(ex){
      btn.disabled = false; btn.textContent = "書き込む"; err.textContent = postErr(ex);
    }
  });
  if(jump){ var t = document.getElementById("res-" + jump); if(t){ t.scrollIntoView({block:"center"}); t.classList.add("hit"); setTimeout(function(){ t.classList.remove("hit"); }, 1600); } }
}

/* ---------- フィードバック ---------- */
function vFeedback(){
  return back() + '<h1>管理者へのフィードバック</h1><p class="lead">要望、不具合、感想を、管理者に直接送ります。他の人には見えません。</p>' +
  '<form id="fbForm" class="card" novalidate>' +
  '<label for="fNick">ニックネーム</label><input id="fNick" type="text" maxlength="30" autocomplete="off">' +
  '<label for="fMsg">内容</label><textarea id="fMsg" maxlength="2000"></textarea>' +
  '<div class="hp" aria-hidden="true"><label for="fHp">ここは空のままにしてください</label><input id="fHp" type="text" tabindex="-1" autocomplete="off"></div>' +
  '<p class="dim" style="font-size:.84rem">日時は自動で付きます。個人情報は書かないでください。</p>' +
  '<p class="err" id="fErr" role="alert"></p>' +
  '<button class="btn" type="submit" id="fBtn">送信する</button></form>';
}
function bindFeedback(){
  var f = $("#fbForm"); if(!f) return;
  f.addEventListener("submit", async function(e){
    e.preventDefault();
    var nick = $("#fNick").value.trim(), msg = $("#fMsg").value.trim(), err = $("#fErr"), btn = $("#fBtn");
    if($("#fHp").value) return;
    if(!nick || !msg){ err.textContent = "ニックネームと内容を入れてください。"; return; }
    err.textContent = "";
    if(CONFIG.formspreeId === "YOUR_FORM_ID"){ err.textContent = "見本表示のため、送信できません。設定後に使えます。"; return; }
    btn.disabled = true;
    try{
      var r = await fetch("https://formspree.io/f/" + encodeURIComponent(CONFIG.formspreeId), {
        method:"POST", headers:{"Accept":"application/json","Content-Type":"application/json"},
        body: JSON.stringify({"日時": fmtDate(new Date().toISOString(), true), "ニックネーム": nick, "内容": msg})
      });
      if(!r.ok) throw new Error("HTTP " + r.status);
      f.innerHTML = '<p><b>送信しました。</b>ありがとうございます。</p><p><a href="#home" data-nav="home">メニューにもどる</a></p>';
    }catch(ex){
      btn.disabled = false;
      err.textContent = "送信できませんでした。少し時間をおいて、もう一度お試しください。";
    }
  });
}

/* ---------- ルーティング ---------- */
function markDemo(){ DEMO = true; $("#demoTag").hidden = false; }
async function route(){
  var h = (location.hash || "#home").slice(1) || "home";
  var m = /^board-(\d{1,6})$/.exec(h);
  if(DEMO || SDEMO) $("#demoTag").hidden = false;
  if(m || h === "board"){ view.innerHTML = vHome(); bindHome(); initBoard(m ? +m[1] : null, true); return; }
  switch(h){
    case "intro": view.innerHTML = vIntro(); break;
    case "start": case "personalize": case "official":
      view.innerHTML = vStart(); window.scrollTo(0,0); fillPersonalize(await loadReleases()); return;
    case "use": view.innerHTML = vUse(); window.scrollTo(0,0); fillSubs(await loadSubs()); return;
    case "post": view.innerHTML = vPost(); bindPost(); break;
    case "feedback": view.innerHTML = vFeedback(); bindFeedback(); break;
    default: view.innerHTML = vHome(); bindHome(); initBoard(null); window.scrollTo(0,0); return;
  }
  window.scrollTo(0,0);
}
document.addEventListener("click", function(e){
  var c = e.target.closest("[data-copy]");
  if(c){ var el = document.getElementById(c.getAttribute("data-copy")); if(el) copyText(el.textContent, c); return; }
  var th = e.target.closest("[data-th]");
  if(th){ showThread(+th.getAttribute("data-th"), window.matchMedia("(max-width:760px)").matches); return; }
  var r = e.target.closest("[data-res]");
  if(r){ e.preventDefault(); var t = document.getElementById("res-" + r.getAttribute("data-res")); if(t){ t.scrollIntoView({block:"center"}); t.classList.add("hit"); setTimeout(function(){ t.classList.remove("hit"); }, 1600); } return; }
  var a = e.target.closest("[data-nav]");
  if(a){ e.preventDefault(); var to = a.getAttribute("data-nav"); if(location.hash === "#" + to) route(); else location.hash = to; }
});
window.addEventListener("hashchange", route);
route();
})();
</script>
