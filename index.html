    case "rate_limited": return "続けて書き込むときは、30秒ほど空けてください。";
    case "busy": return "書き込みが混み合っています。少し待ってから、もう一度お試しください。";
    case "invalid_url": return "URL は https://claude.ai/artifact/… の形で入れてください。";
    case "invalid": return "入力の長さを確かめてください。";
    case "full": return "このスレッドは書き込みの上限(1000)に達しました。新しいスレッドを立ててください。";
    case "not_found": return "このスレッドは見つかりません。";
    default: return "送信できませんでした。少し時間をおいて、もう一度お試しください。";
  }
}

  var items = list.filter(function(x){ return x.nick && x.url && URL_OK.test(x.url); });

}

function bindPost(){
  var f = $("#postForm"); if(!f) return;
  f.addEventListener("submit", async function(e){
    e.preventDefault();
    var nick = $("#pNick").value.trim(), pt = $("#pPoint").value.trim(), url = $("#pUrl").value.trim(), err = $("#pErr"), btn = $("#pBtn");
    if(!nick){ err.textContent = "ニックネームを入れてください。"; return; }
    if(!pt){ err.textContent = "改善ポイントを入れてください。"; return; }
    if(!URL_OK.test(url)){ err.textContent = "URL は https://claude.ai/artifact/… の形で入れてください。"; return; }
    err.textContent = "";
    if(SDEMO){ err.textContent = "見本表示のため、送信できません。設定後に使えます。"; return; }
    btn.disabled = true; btn.textContent = "送信中…";
    try{
      await sheetPost({action:"sub", nick:nick, point:pt, url:url, hp:$("#pHp").value});
      f.innerHTML = '<p><b>投稿しました。</b>ありがとうございます。</p><p><a class="btn ghost sm" href="#use" data-nav="use">編集版“英語は友達”の一覧を見る</a></p>';
    }catch(ex){
      btn.disabled = false; btn.textContent = "投稿する"; err.textContent = postErr(ex);
    }
  });
}

/* ---------- 掲示板(2ちゃんねる風・トップの下半分) ---------- */
var RULES = '<p class="rules">ルール: 中傷、個人情報、宣伝や迷惑な書き込みは、管理者が削除することがあります。名前は空欄なら「名無しさん」、ID は端末ごとに1日ごとに変わります。</p>';
var BD = {cur:null, list:[]};
async function initBoard(want, scroll){
  var list = await loadThreads(true);
  BD.list = list === "err" ? [] : list;
  fillThreads(list);
  if(list === "err"){ $("#bdMain") && ($("#bdMain").innerHTML = LOAD_ERR); return; }
  var id = want && BD.list.some(function(t){ return t.id === want; }) ? want : busiest();
  if(id) showThread(id, scroll); else bdEmpty();
}
function busiest(){
  var best = null;
  BD.list.forEach(function(t){ if(!best || (t.count||0) > (best.count||0) || ((t.count||0) === (best.count||0) && t.updated > best.updated)) best = t; });
  return best && best.id;
}
function bdEmpty(){
  var m = $("#bdMain"); if(!m) return;
  m.innerHTML = '<div class="card dim" style="margin:auto 0">まだスレがありません。右の「＋ スレを立てる」から、最初のスレを立ててみませんか?</div>';
}
function markCur(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-th]"), function(b){ b.setAttribute("aria-current", String(+b.getAttribute("data-th") === BD.cur)); });
}
async function showThread(n, scroll){
  var m = $("#bdMain"); if(!m) return;
  BD.cur = n; markCur();
  m.innerHTML = '<div id="thread"><span class="dim">読み込み中…</span></div>'; m.scrollTop = 0;
  if(scroll) m.scrollIntoView({block:"start", behavior:"smooth"});
  fillThread(await loadThread(n), n);
}
function bdNewForm(){
  var m = $("#bdMain"); if(!m) return;
  BD.cur = null; markCur();
  m.scrollTop = 0;
  m.innerHTML = '<form id="thForm" novalidate><h2 style="margin-bottom:4px">新しいスレを立てる</h2>' +
  '<label for="tName">名前(空欄なら名無しさん)</label><input id="tName" type="text" maxlength="30" autocomplete="off">' +
  '<label for="tTitle">スレのタイトル</label><input id="tTitle" type="text" maxlength="60" autocomplete="off">' +
  '<label for="tBody">最初の書き込み</label><textarea id="tBody" maxlength="30000" data-count="tBodyCnt"></textarea><p class="hint"><span class="cnt" id="tBodyCnt">0 / 30,000 字</span>YouTube のリンクや埋め込みコードを貼ると、動画がそのまま表示されます。</p>' +
  hpField("tHp") +
  '<p class="err" id="tErr" role="alert"></p><p><button class="btn" type="submit" id="tBtn">スレを立てる</button> <button class="btn ghost" type="button" id="tCancel">やめる</button></p></form>';
  if(window.matchMedia("(max-width:760px)").matches) m.scrollIntoView({block:"start", behavior:"smooth"});
  setTimeout(function(){ var t = $("#tTitle"); if(t) t.focus({preventScroll:true}); }, 50);
  $("#tCancel").addEventListener("click", function(){ var id = busiest(); if(id) showThread(id); else bdEmpty(); });
  $("#thForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var name = $("#tName").value.trim(), t = $("#tTitle").value.trim(), b = $("#tBody").value.trim(), err = $("#tErr"), btn = $("#tBtn");
    if(!t || !b){ err.textContent = "タイトルと最初の書き込みを入れてください。"; return; }
    if(b.length > MAX_BODY){ err.textContent = "本文は 30,000 字までです。"; return; }
    err.textContent = "";
    if(SDEMO){ err.textContent = "見本表示のため、送信できません。設定後に使えます。"; return; }
    btn.disabled = true; btn.textContent = "送信中…";
    try{
      var r = await sheetPost({action:"thread", name:name, title:t, body:b, hp:$("#tHp").value});
      initBoard(r.id);
    }catch(ex){
      btn.disabled = false; btn.textContent = "スレを立てる"; err.textContent = postErr(ex);
    }
  });
}
async function loadThreads(){
  if(SDEMO) return D_THREADS;
  try{ return (await sheetGet("a=threads")).threads || []; }catch(e){ return "err"; }
}
function fillThreads(list){
  var box = $("#thlist"); if(!box) return;
  if(list === "err"){ box.innerHTML = '<p class="dim" style="font-size:.86rem">読み込めませんでした。</p>'; return; }
  if(!list.length){ box.innerHTML = '<p class="dim" style="font-size:.86rem">まだスレがありません。</p>'; return; }
  box.innerHTML = '<ul class="threads">' + list.map(function(t){
    return '<li><button type="button" data-th="'+t.id+'" aria-current="false"><span class="tl">'+esc(t.title)+'<span class="c">('+(t.count||0)+')</span></span><span class="tm">'+esc(fmtDate(t.updated, true))+'</span></button></li>';
  }).join("") + '</ul>';
  markCur();
}

/* 書き込みの表示: 文字はすべて文字として出す。YouTube だけは動画 ID を取り出して、こちらで作った再生枠を出す */
var MAX_EMBED = 3, MAX_BODY = 30000, CLIP_PX = 360;
/* 長い書き込みは折りたたむ(「全て表示」「一部を表示」で切り替え) */
function clipLong(box){
  Array.prototype.forEach.call(box.querySelectorAll(".res .rb"), function(rb){
    if(rb.scrollHeight <= CLIP_PX + 120) return;
    var len = rb.textContent.length;
    rb.classList.add("clip");
    var b = document.createElement("button");
    b.type = "button"; b.className = "more"; b.setAttribute("aria-expanded","false");
    var show = "全て表示(" + len.toLocaleString("ja-JP") + " 字)", hide = "一部を表示";
    b.textContent = show;
    b.addEventListener("click", function(){
      var open = rb.classList.toggle("clip") === false;
      b.textContent = open ? hide : show; b.setAttribute("aria-expanded", String(open));
      if(!open) rb.parentNode.scrollIntoView({block:"nearest"});
    });
    rb.insertAdjacentElement("afterend", b);
  });
}
document.addEventListener("input", function(e){
  var t = e.target, id = t && t.getAttribute && t.getAttribute("data-count");
  if(!id) return; var c = document.getElementById(id);
  if(c){ c.textContent = t.value.length.toLocaleString("ja-JP") + " / 30,000 字"; c.classList.toggle("over", t.value.length >= MAX_BODY); }
});
function ytId(u){
  var x; try{ x = new URL(u); }catch(e){ return null; }
  if(x.protocol !== "https:" && x.protocol !== "http:") return null;
  var h = x.hostname.replace(/^(www|m|music)\./, ""), id = null, m;
  if(h === "youtu.be") id = x.pathname.slice(1).split("/")[0];
  else if(h === "youtube.com" || h === "youtube-nocookie.com"){
    if(x.pathname === "/watch") id = x.searchParams.get("v");
    else if((m = /^\/(?:embed|shorts|live|v)\/([^/?#]+)/.exec(x.pathname))) id = m[1];
  }
  if(!id || !/^[A-Za-z0-9_-]{11}$/.test(id)) return null;
  var t = x.searchParams.get("start") || x.searchParams.get("t") || "", sec = 0;
  if(/^\d+$/.test(t)) sec = +t;
  else if((m = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/.exec(t)) && t) sec = (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0);
  return {id:id, start:sec};
}
function ytEmbed(v){
  return '<span class="yt"><iframe src="https://www.youtube-nocookie.com/embed/'+v.id+(v.start ? '?start='+v.start : '')+'" title="YouTube 動画" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></span>';
}
function plain(t){ return esc(t).replace(/&gt;&gt;(\d{1,4})/g, '<a href="#" data-res="$1">&gt;&gt;$1</a>'); }
function resBody(text){
  var src = String(text || ""), out = "", last = 0, n = 0, m;
  // 1) <iframe ... src="..."></iframe>  2) http(s) の URL
  var re = /<iframe\b[^>]*?\bsrc\s*=\s*["']([^"']+)["'][^>]*>(?:\s*<\/iframe>)?|https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&()*+,;=%]+/gi;
  while((m = re.exec(src))){
    var whole = m[0], url = m[1] || whole, tail = "";
    if(!m[1]){ var tr = /[.,!?;:)\]]+$/.exec(url); if(tr){ tail = tr[0]; url = url.slice(0, -tail.length); } }
    var v = ytId(url), html;
    if(v && n < MAX_EMBED){ n++; html = ytEmbed(v); }
    else if(m[1]){ html = null; }                       // YouTube 以外の iframe は、ただの文字として出す
    else { html = '<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer nofollow ugc">'+esc(url)+'</a>'; }
    if(html === null) continue;
    var before = src.slice(last, m.index);
    if(html.indexOf('class="yt"') > 0) before = before.replace(/\n$/, "");
    out += plain(before) + html + esc(tail);
    last = m.index + whole.length;
    if(html.indexOf('class="yt"') > 0 && src.charAt(last) === "\n") last++;
  }
  return out + plain(src.slice(last));
}
async function loadThread(n){
  if(SDEMO){
    var t = D_THREADS.filter(function(x){ return x.id === n; })[0];
    return t ? {thread:t, posts:D_POSTS[n] || []} : null;
  }
  try{ return await sheetGet("a=thread&id=" + n); }
  catch(e){ return e.code === "not_found" ? null : "err"; }
}
function fillThread(d, n, jump){
  var box = $("#thread"); if(!box) return;
  if(d === "err"){ box.innerHTML = LOAD_ERR; return; }
  if(!d){ box.innerHTML = '<div class="card dim">このスレッドは見つかりません。</div>'; return; }
  var html = '<h2 class="tt">'+esc(d.thread.title)+'</h2>';
  d.posts.forEach(function(r){
    html += '<div class="res" id="res-'+r.no+'">' + (r.deleted
      ? '<div class="rh"><span class="n">'+r.no+'</span> 名前: <span class="nm">あぼーん</span></div><div class="rb dim">このレスは削除されました</div>'
      : '<div class="rh"><span class="n">'+r.no+'</span> 名前: <span class="nm">'+esc(r.name || "名無しさん")+'</span> : '+esc(fmtDate(r.at, true))+' ID:'+esc(r.uid || "???")+'</div><div class="rb">'+resBody(r.body)+'</div>') +
      '</div>';
  });
  var full = (d.thread.count || d.posts.length) >= 1000;
  html += full ? '<div class="card dim" style="margin-top:16px">このスレッドは書き込みの上限(1000)に達しました。新しいスレッドを立ててください。</div>'
    : '<form id="rpForm" class="card" style="margin-top:18px" novalidate>' +
      '<label for="rName">名前(空欄なら名無しさん)</label><input id="rName" type="text" maxlength="30" autocomplete="off">' +
      '<label for="rBody">書き込む内容</label><textarea id="rBody" maxlength="30000" data-count="rBodyCnt" placeholder="&gt;&gt;1 のように書くと、そのレスへの返信になります"></textarea><p class="hint"><span class="cnt" id="rBodyCnt">0 / 30,000 字</span>YouTube のリンクや埋め込みコードを貼ると、動画がそのまま表示されます。</p>' +
      hpField("rHp") +
      '<p class="err" id="rErr" role="alert"></p><button class="btn" type="submit" id="rBtn">書き込む</button></form>';
  box.innerHTML = html;
  clipLong(box);
  var f = $("#rpForm");
  if(f) f.addEventListener("submit", async function(e){
    e.preventDefault();
    var name = $("#rName").value.trim(), b = $("#rBody").value.trim(), err = $("#rErr"), btn = $("#rBtn");
    if(!b){ err.textContent = "書き込む内容を入れてください。"; return; }
    if(b.length > MAX_BODY){ err.textContent = "本文は 30,000 字までです。"; return; }
    err.textContent = "";
    if(SDEMO){ err.textContent = "見本表示のため、送信できません。設定後に使えます。"; return; }
    btn.disabled = true; btn.textContent = "送信中…";
    try{
      var r = await sheetPost({action:"reply", id:n, name:name, body:b, hp:$("#rHp").value});
      fillThread(await loadThread(n), n, r.no);
      loadThreads().then(function(l){ if(l !== "err"){ BD.list = l; fillThreads(l); } });
    }catch(ex){
      btn.disabled = false; btn.textContent = "書き込む"; err.textContent = postErr(ex);
    }
  });
  if(jump){ var t = document.getElementById("res-" + jump); if(t){ t.scrollIntoView({block:"center"}); t.classList.add("hit"); setTimeout(function(){ t.classList.remove("hit"); }, 1600); } }
}

/* ---------- フィードバック ---------- */
function vFeedback(){
  return back() + '<h1>管理者へのフィードバック</h1><p class="lead">要望、不具合、感想を、管理者に直接送ります。他の人には見えません。</p>' +
  '<form id="fbForm" class="card" novalidate>' +
  '<label for="fNick">ニックネーム</label><input id="fNick" type="text" maxlength="30" autocomplete="off">' +
  '<label for="fMsg">内容</label><textarea id="fMsg" maxlength="2000"></textarea>' +
  '<div class="hp" aria-hidden="true"><label for="fHp">ここは空のままにしてください</label><input id="fHp" type="text" tabindex="-1" autocomplete="off"></div>' +
  '<p class="dim" style="font-size:.84rem">日時は自動で付きます。個人情報は書かないでください。</p>' +
  '<p class="err" id="fErr" role="alert"></p>' +
  '<button class="btn" type="submit" id="fBtn">送信する</button></form>';
}
function bindFeedback(){
  var f = $("#fbForm"); if(!f) return;
  f.addEventListener("submit", async function(e){
    e.preventDefault();
    var nick = $("#fNick").value.trim(), msg = $("#fMsg").value.trim(), err = $("#fErr"), btn = $("#fBtn");
    if($("#fHp").value) return;
    if(!nick || !msg){ err.textContent = "ニックネームと内容を入れてください。"; return; }
    err.textContent = "";
    if(CONFIG.formspreeId === "YOUR_FORM_ID"){ err.textContent = "見本表示のため、送信できません。設定後に使えます。"; return; }
    btn.disabled = true;
    try{
      var r = await fetch("https://formspree.io/f/" + encodeURIComponent(CONFIG.formspreeId), {
        method:"POST", headers:{"Accept":"application/json","Content-Type":"application/json"},
        body: JSON.stringify({"日時": fmtDate(new Date().toISOString(), true), "ニックネーム": nick, "内容": msg})
      });
      if(!r.ok) throw new Error("HTTP " + r.status);
      f.innerHTML = '<p><b>送信しました。</b>ありがとうございます。</p><p><a href="#home" data-nav="home">メニューにもどる</a></p>';
    }catch(ex){
      btn.disabled = false;
      err.textContent = "送信できませんでした。少し時間をおいて、もう一度お試しください。";
    }
  });
}

/* ---------- ルーティング ---------- */
async function route(){
  var h = (location.hash || "#home").slice(1) || "home";
  var m = /^board-(\d{1,6})$/.exec(h);
  if(SDEMO) $("#demoTag").hidden = false;
  if(m || h === "board"){ view.innerHTML = vHome(); bindHome(); initBoard(m ? +m[1] : null, true); return; }
  switch(h){
    case "intro": view.innerHTML = vIntro(); break;
    case "start": case "personalize": case "official":
      view.innerHTML = vStart(); break;
    case "use": view.innerHTML = vUse(); window.scrollTo(0,0); fillSubs(await loadSubs()); return;
    case "post": view.innerHTML = vPost(); bindPost(); break;
    case "feedback": view.innerHTML = vFeedback(); bindFeedback(); break;
    default: view.innerHTML = vHome(); bindHome(); initBoard(null); window.scrollTo(0,0); return;
  }
  window.scrollTo(0,0);
}
document.addEventListener("click", function(e){
  var c = e.target.closest("[data-copy]");
  if(c){ var el = document.getElementById(c.getAttribute("data-copy")); if(el) copyText(el.textContent, c); return; }
  var th = e.target.closest("[data-th]");
  if(th){ showThread(+th.getAttribute("data-th"), window.matchMedia("(max-width:760px)").matches); return; }
  var r = e.target.closest("[data-res]");
  if(r){ e.preventDefault(); var t = document.getElementById("res-" + r.getAttribute("data-res")); if(t){ t.scrollIntoView({block:"center"}); t.classList.add("hit"); setTimeout(function(){ t.classList.remove("hit"); }, 1600); } return; }
  var a = e.target.closest("[data-nav]");
  if(a){ e.preventDefault(); var to = a.getAttribute("data-nav"); if(location.hash === "#" + to) route(); else location.hash = to; }
});
window.addEventListener("hashchange", route);
route();
})();
